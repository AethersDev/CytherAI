<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare · THE UNHAPPENED</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self';">
<!-- A design-review tool, linked from nothing: two versions live, one scroll position. ?2,3 picks the pair. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#EEF0F2;font:400 12px/1 ui-monospace,"SF Mono",Menlo,monospace;color:#0B0F19}
iframe{position:fixed;top:0;left:0;width:100%;height:100%;border:0}
body[data-show="1"]:not(.split) #v2,body[data-show="2"]:not(.split) #v1{visibility:hidden}
body.split iframe{width:50%}body.split #v2{left:50%}
body.split::after{content:"";position:fixed;top:0;bottom:0;left:50%;width:1px;background:#0B0F19;z-index:3}
.bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:4;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.86);border:1px solid rgba(11,15,25,.14);backdrop-filter:blur(10px)}
.bar button{white-space:nowrap;font:inherit;color:#373E4E;background:none;border:0;border-radius:999px;padding:8px 12px;cursor:pointer}
.bar button[aria-pressed=true]{background:#0B0F19;color:#fff}
.bar b{font-weight:400;opacity:.6;margin-right:6px}
</style>
</head>
<body data-show="1">
<iframe id="v1" title="first version"></iframe>
<iframe id="v2" title="second version"></iframe>
<div class="bar" role="toolbar" aria-label="Compare versions">
  <button data-show="1" aria-pressed="true"><b>1</b>Version 1</button>
  <button data-show="2" aria-pressed="false"><b>2</b>Version 2</button>
  <button id="split" aria-pressed="false"><b>S</b>Side by side</button>
</div>
<script src="compare.js" defer></script>
</body>
</html>
